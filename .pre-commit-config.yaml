repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: \.(svg|png|webp)$
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["-S", "style"]

  - repo: local
    hooks:
      - id: stylelint
        name: stylelint
        entry: bunx stylelint
        language: system
        types: [css]

      - id: html-validate
        name: html-validate
        entry: bunx html-validate
        language: system
        types: [html]
        exclude: ^resume\.html$

      - id: bun-test
        name: bun test (scripts)
        entry: bun test scripts/
        language: system
        files: ^scripts/
        pass_filenames: false

      - id: optimize-images
        name: optimize images
        entry: scripts/optimize-images.sh
        language: system
        files: \.(svg|webp)$

      - id: gitleaks
        name: gitleaks
        entry: gitleaks protect --staged --verbose
        language: system
        pass_filenames: false
