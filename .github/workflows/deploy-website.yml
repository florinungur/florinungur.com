name: Deploy website to GitHub Pages
on:
  push:
    branches:
      - main
    paths-ignore:
      - "ADR.md"
      - "CLAUDE.md"
      - "README.md"
      - "LICENSE"
      - "Makefile"
      - ".claude/**"
      - ".htmlvalidate.json"
      - ".pre-commit-config.yaml"
      - ".stylelintrc.json"
      - ".gitignore"
  # No ref input: deploy-pages records the run's own commit, so a rollback is a revert on main.
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --production
      - name: Cache apt packages
        id: apt-cache
        uses: actions/cache@v6
        with:
          path: /tmp/apt-pkgs
          key: apt-${{ runner.os }}-${{ hashFiles('scripts/install-system-deps.sh') }}
      - name: Install system dependencies
        run: scripts/install-system-deps.sh "${{ steps.apt-cache.outputs.cache-hit }}"
      - name: Build site
        run: scripts/build.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
